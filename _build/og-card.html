<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,600,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#000;overflow:hidden;
       font-family:"Satoshi",system-ui,sans-serif;color:#fff;position:relative}
  .glow{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
  .g1{width:520px;height:520px;right:-90px;top:-120px;
      background:linear-gradient(135deg,rgba(0,122,255,.55),rgba(96,0,255,.42));opacity:.75}
  .g2{width:360px;height:360px;left:-110px;bottom:-140px;
      background:radial-gradient(circle,rgba(255,138,0,.30),transparent 70%);opacity:.6}
  .wrap{position:relative;z-index:2;height:100%;padding:76px 84px;
        display:flex;flex-direction:column;justify-content:space-between}
  .brand{font-size:40px;font-weight:600;letter-spacing:-.03em}
  .brand span{color:#3366ff}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:15px;letter-spacing:.22em;
           text-transform:uppercase;color:rgba(122,160,255,.95);display:flex;
           align-items:center;gap:12px;margin-bottom:26px}
  .eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:#3366ff;
                   box-shadow:0 0 14px rgba(51,102,255,.8)}
  h1{font-size:82px;line-height:1.03;letter-spacing:-.035em;font-weight:500;
     text-transform:lowercase;max-width:15ch}
  h1 i{font-style:normal;color:#3366ff}
  .sub{margin-top:26px;font-size:23px;line-height:1.5;color:rgba(255,255,255,.62);max-width:44ch}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;
        font-family:"IBM Plex Mono",monospace;font-size:14px;letter-spacing:.16em;
        text-transform:uppercase;color:rgba(255,255,255,.42)}
  .rule{position:absolute;left:84px;right:84px;bottom:132px;height:1px;
        background:rgba(255,255,255,.12)}
</style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="wrap">
    <div class="brand">form<span>.</span></div>
    <div>
      <div class="eyebrow">operational architecture</div>
      <h1>the systems behind movement<i>.</i></h1>
      <p class="sub">We build the operational infrastructure underneath how an organization actually runs.</p>
    </div>
    <div class="rule"></div>
    <div class="foot">
      <span>formintel.co</span>
      <span>ATL &middot; CLT &middot; MIA &middot; BHM &middot; GVL</span>
    </div>
  </div>
</body>
</html>
