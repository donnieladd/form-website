<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Thank you · form.</title><style>@font-face{font-family:"Satoshi";src:url(fonts/satoshi-500.woff2) format("woff2");font-weight:500;font-style:normal;font-display:swap}@font-face{font-family:"Satoshi";src:url(fonts/satoshi-700.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}@font-face{font-family:"Satoshi";src:url(fonts/satoshi-900.woff2) format("woff2");font-weight:900;font-style:normal;font-display:swap}@font-face{font-family:"Manrope Variable";src:url(fonts/manrope-var.woff2) format("woff2");font-weight:200 800;font-style:normal;font-display:swap}@font-face{font-family:"League Spartan";src:url(fonts/leaguespartan-var.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}@font-face{font-family:"IBM Plex Mono";src:url(fonts/plexmono-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:"Satoshi";src:url(fonts/satoshi-500-italic.otf) format("opentype");font-weight:500;font-style:italic;font-display:swap}/* ============================================================
   form. — PRIMITIVES
   Layer 1 of the token system: raw values, no semantics.
   Framework-agnostic. Nothing here references a role; semantic.css
   maps roles onto these, departments.css swaps ONE variable.

   Reconciled from the brand constitution (brand-book-v1) and the
   as-built code (form-artifacts, form.intelligence console,
   lead-generator). Where declared canon and shipped code disagreed,
   the ruling is noted inline with `RECONCILED:`.
   ============================================================ */

:root {
  /* --- HOUSE GROUNDS ---------------------------------------
     The void is never pure #000. Paper is never stark white.  */
  --void:        #05070b;  /* dark-world ground; ink on paper (constitution) */
  --void-under:  #030407;  /* deepest step under the void */
  --near:        #0a0d12;  /* near-black step */
  --panel:       #141821;  /* raised glass surface in the void */
  --panel-raise: #1a1f2b;
  --panel-deep:  #0e1119;

  --paper:       #fafafa;  /* light-world ground (warm-neutral) */
  --paper-raise: #ffffff;
  --paper-deep:  #f4f5f7;
  --soft:        #f4f5f7;  /* soft off-white; body text on dark */
  --near-2:      #0a0d12;  /* guide's near-black step (--near) */

  /* --- HAIRLINES (guide tokens: --line/--line2 light, -d dark) - */
  --hairline-light:   rgba(10, 13, 18, 0.10);
  --hairline-light-2: rgba(10, 13, 18, 0.16);
  --hairline-dark:    rgba(244, 245, 247, 0.10);
  --hairline-dark-2:  rgba(244, 245, 247, 0.18);

  /* --- LIGHT-WORLD INK -------------------------------------
     RECONCILED: shipped surfaces use #0b0d12 (a hair warmer than
     the void), and the ink-dim .60 tier is AA-measured against it
     (5.05:1 over #fafafa). Kept as the tested value; the void
     #05070b remains the dark-world ground/ink. */
  --ink-black:  #0b0d12;
  --white:      #ffffff;

  /* Ink is expressed as opacity tiers of the world's base ink.
     semantic.css/worlds.css bind --ink per world; these are the
     canonical alphas of the ladder (100 / 80 / 64 / 55 / ghost). */
  --a-soft:  0.76;
  --a-faint: 0.56;
  --a-dim:   0.60;   /* RECONCILED: .60 not lineage .42 — AA fix */
  --a-ghost: 0.16;
  /* guide's declared ladder variant (100/80/64/55) — pick per surface */
  --a-lead:    0.80;
  --a-body:    0.64;
  --a-caption: 0.55;
  --dim:     #6f7682; /* the system's quiet ink (tertiary / mono meta) */
  --muted:   #a7adb7;

  /* --- THE SIX DEPARTMENT SIGNAL FAMILIES ------------------
     Every department is THIS system with one variable changed.
     Four roles each: signal (speaks) · deep (edges) · rim (glows)
     · ice (the pass-through midpoint). `-text` = small-text-safe
     accent (measured where shipped; = deep as a safe default
     elsewhere until measured). rose is RETIRED. */

  /* form.digital — the blues (shipped) */
  --digital-signal: #3d6bff;
  --digital-deep:   #2e54d8;
  --digital-rim:    #5ab6ff;
  --digital-ice:    #a9ccff;
  --digital-text:   #375fe6;  /* measured AA small-text */

  /* form.cm — molten amber (shipped: form-creative-website) */
  --cm-signal: #f07e1c;
  --cm-deep:   #d9660d;
  --cm-rim:    #ffa94e;
  --cm-ice:    #ffd9a6;
  --cm-text:   #a3510b;  /* measured molasses ink for body on light */

  /* form.exp — critical red */
  --exp-signal: #f3523f;
  --exp-deep:   #e64b39;
  --exp-rim:    #ff8168;
  --exp-ice:    #ffc7ba;
  --exp-text:   #e64b39;  /* TBD: measure body-size on light */

  /* form.strategy — emerald */
  --strategy-signal: #17b77a;
  --strategy-deep:   #0e9c64;
  --strategy-rim:    #5ce3b0;
  --strategy-ice:    #b5f2d9;
  --strategy-text:   #0e9c64; /* TBD: measure */

  /* form.ai — violet (also the house "spark", ~1% usage) */
  --ai-signal: #9b6bff;
  --ai-deep:   #7f4ee8;
  --ai-rim:    #be9bff;
  --ai-ice:    #e0d0ff;
  --ai-text:   #7f4ee8;  /* TBD: measure */

  /* form.support — steel (reflects, never emits; glows at half) */
  --support-signal: #94a3bc;
  --support-deep:   #76839b;
  --support-rim:    #c9d5e8;
  --support-ice:    #eaf0f8;
  --support-text:   #76839b;

  /* The spark — form.ai violet used at ~1% on non-ai surfaces.
     "If in doubt: don't." */
  --spark: #9b6bff;

  /* --- STATE SIGNALS (meaning, not decoration; outside families) --
     Light ground values; dark-world variants live in worlds.css.
     NOTE: form.cm rebinds --warn to olive #6b5f14 (departments.css)
     so the warn state never collides with amber signal. */
  --live: #16794b;  --live-wash: rgba(22, 121, 75, 0.10);
  --warn: #8a5a00;  --warn-wash: rgba(138, 90, 0, 0.10);
  --stop: #b3261e;  --stop-wash: rgba(179, 38, 30, 0.09);

  /* --- SPACING (fluid clamps; never invent a value) --------- */
  --s-2: clamp(14px, 1.6vw, 18px);
  --s-3: clamp(22px, 2.6vw, 30px);
  --s-4: clamp(32px, 3.8vw, 46px);
  --s-5: clamp(46px, 5.5vw, 68px);
  --s-6: clamp(68px, 9vh, 110px);
  --s-7: clamp(96px, 13vh, 170px);
  --g1: clamp(14px, 1.7vw, 18px);
  --g2: clamp(16px, 2vw, 22px);
  --shell:  1188px;                       /* RECONCILED: code consensus */
  --gutter: clamp(1.25rem, 5vw, 3.5rem);

  /* --- RADIUS ---------------------------------------------- */
  --r:    14px;   /* RECONCILED: shipped consensus (guide's 18px is older) */
  --r-sm: 10px;
  --r-md: 12px;   /* console bridge */
  --r-xl: 18px;   /* guide's --r; kept as the large step */
  --r-glass: 22px;/* glass gets its own radius — glass at 14px reads as plastic */
  --pill: 999px;

  /* The filed exception: overshoot spring, sanctioned ONLY for the
     two owner-picked components (nav-spring, fab-orbital). The
     covenant — "nothing bounces" — stands everywhere else. */
  --ease-spring: cubic-bezier(0.34, 1.56, 0.5, 1);

  /* --- SHADOWS (semantic; scarce and functional) ------------ */
  --shadow-soft:  0 22px 70px rgba(5, 7, 11, 0.055);   /* guide 08·b */
  --shadow-card:  0 18px 50px rgba(5, 7, 11, 0.045);   /* guide 08·b */
  --shadow-float: 0 18px 60px rgba(11, 13, 18, 0.16);  /* console */
  --shadow-focus: 0 0 0 3px var(--signal-wash);        /* console */

  /* --- DENSITY LADDER (console) ----------------------------- */
  --text-nano:    0.6875rem;  /* 11px */
  --text-micro:   0.75rem;    /* 12px */
  --text-compact: 0.8125rem;  /* 13px */

  /* --- SHELL GEOMETRY (console app chrome) ------------------ */
  --shell-rail:           15rem;
  --shell-rail-collapsed: 3.5rem;
  --shell-header:         3rem;

  /* --- IMAGE CROPS (console) -------------------------------- */
  --crop-portrait:  4 / 5;
  --crop-landscape: 16 / 9;
  --crop-avatar:    1 / 1;

  /* --- FINISH CONSTANTS ------------------------------------- */
  --grain-opacity: 0.055;   /* guide alt: .11 (declared 8–13%) — pick per surface */
  --grid-cell:      96px;   /* blueprint grid, cover (artifacts lineage) */
  --grid-cell-fine: 72px;   /* guide's specimen cell (72/74px) */
  --marquee-dur:      42s;  /* dark ribbons */
  --marquee-dur-paper:36s;  /* paper ribbons */

  /* --- MOTION (two curves run everything; settles, never bounces) */
  --ease-form: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-veil: cubic-bezier(0.16, 1, 0.3, 1);
  --motion-fast: 120ms;
  --motion-base: 200ms;
  --motion-slow: 320ms;

  /* --- Z-INDEX LADDER (never invent a layer) --------------- */
  --z-field: 0;
  --z-canvas: 1;
  --z-scene: 5;
  --z-section: 10;
  --z-rail: 40;
  --z-banner: 50;
  --z-grain: 60;
  --z-gate: 70;

  /* --- THE THREE GRADIENTS (only three exist; anything else is
         a defect). Bound to the active department's signal family. */
  --grad-rail: linear-gradient(90deg, var(--signal), var(--rim));
  --grad-chip: linear-gradient(180deg, var(--deep), var(--signal), var(--deep));
  --grad-ink:  linear-gradient(102deg, var(--rim) 4%, var(--ice) 52%, var(--signal) 96%);
}
/* ============================================================
   form. — SEMANTIC ROLES
   Layer 2: maps meaning onto primitives. Components read ONLY these
   roles, never a raw hex. This is the shadcn-style bridge, native.

   The house default IS form.digital (the blues) — the parent brand.
   A department class (departments.css) rebinds the signal family;
   a world class (worlds.css) rebinds ink/ground per surface.

   The default :root here is the LIGHT world (paper). Dark worlds
   re-declare their full ink set in worlds.css (law: every world
   declares its full token set, never a delta).
   ============================================================ */

:root {
  /* --- the committed accent: house = digital blues --------- */
  --signal:      var(--digital-signal);
  --deep:        var(--digital-deep);
  --rim:         var(--digital-rim);
  --ice:         var(--digital-ice);
  --signal-text: var(--digital-text);
  --signal-wash: rgba(61, 107, 255, 0.10);
  --signal-line: rgba(61, 107, 255, 0.34);
  --signal-soft: rgba(61, 107, 255, 0.06);

  /* --- ink (light world / paper) --------------------------- */
  --ink:       var(--ink-black);
  --ink-soft:  rgba(11, 13, 18, 0.76);
  --ink-faint: rgba(11, 13, 18, 0.56);
  --ink-dim:   rgba(11, 13, 18, 0.60);
  --ink-ghost: rgba(11, 13, 18, 0.16);

  /* --- structure ------------------------------------------- */
  --line:        rgba(11, 13, 18, 0.12);
  --line-strong: rgba(11, 13, 18, 0.22);
  --hairline:    var(--line);  /* named alias — brand-elevation-brief v2 (2026-08-26) panel-hairline token */

  /* --- surfaces / grounds ---------------------------------- */
  --ground:     var(--paper);
  --base:       var(--paper);
  --base-raise: var(--paper-raise);
  --base-deep:  var(--paper-deep);
  --field-bg:   var(--paper-raise);
  --card-bg:    var(--paper-raise);

  /* --- shadcn-compatible semantic aliases ------------------
     So a shadcn/Tailwind app can consume the same source of truth
     (see adapters/). These name the same roles shadcn expects. */
  --background:            var(--base);
  --foreground:            var(--ink);
  --card:                  var(--card-bg);
  --card-foreground:       var(--ink);
  --popover:               var(--base-raise);
  --popover-foreground:    var(--ink);
  --primary:               var(--signal);
  --primary-foreground:    var(--white);
  --secondary:             var(--base-deep);
  --secondary-foreground:  var(--ink-soft);
  --muted-bg:              var(--base-deep);
  --muted-foreground:      var(--ink-dim);
  --accent:                var(--signal-wash);
  --accent-foreground:     var(--signal-text);
  --destructive:           var(--stop);
  --destructive-foreground:var(--white);
  --success:               var(--live);
  --warning:               var(--warn);
  --border:                var(--line);
  --input:                 var(--line);
  --ring:                  var(--signal);
  --radius:                var(--r);

  /* --- focus / selection / caret --------------------------- */
  --focus-ring: var(--rim);
}

/* Base element behaviour (a host app may override). */
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 400;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
::selection { background: color-mix(in srgb, var(--signal) 24%, transparent); color: var(--ink); }
input, textarea { caret-color: var(--signal); }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; border-radius: 2px; }
/* ============================================================
   form. — TYPOGRAPHY
   Three voices, the tracking poles (the fingerprint), the weight law.

   RECONCILED — the machine layer:
   The brand-book HTML still names IBM Plex Mono as the machine layer.
   Superseded 2026-08-13 across three shipped surfaces (console,
   lead-generator, form-creative-website): the machine/label + body-UI
   voice is now LEAGUE SPARTAN. IBM Plex Mono is retained ONLY for the
   slogan surface. That is the canon here.
   ============================================================ */

:root {
  /* Self-hosted (woff2). Never waits on a font network.
     The var(--font-*-local) hooks let a host app inject its own
     @font-face-declared family name; the quoted fallback is the
     face itself, then the system stack. */
  --font-satoshi: "Satoshi", -apple-system, BlinkMacSystemFont, "Segoe UI",
    ui-sans-serif, sans-serif;
  --font-manrope: "Manrope Variable", "Manrope", ui-sans-serif, system-ui,
    sans-serif;
  --font-label: "League Spartan", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  /* Role aliases — what each voice is FOR. */
  --font-display: var(--font-satoshi); /* conviction: headlines, wordmark, verdicts */
  --font-body:    var(--font-label);   /* clarity in UI: body + labels (Spartan) */
  --font-reading: var(--font-manrope); /* long-form reading copy */
  --font-numeral: var(--font-manrope); /* ALL numerals, tabular */
  --font-machine: var(--font-label);   /* the machine layer (uppercase labels) */
  --font-slogan:  var(--font-mono);    /* IBM Plex Mono — slogan surface ONLY */

  /* The tracking poles — display pulls tight, mono opens wide.
     "That tension is the fingerprint." Never a fourth pole. */
  --track-hero:    -0.072em; /* hero/display, pulls tightest */
  --track-display: -0.06em;
  --track-numeral: -0.03em;
  --track-mono:     0.2em;   /* opens 0.14–0.24em at 9–12px */
}

/* --- THE WEIGHT LAW: bigger = lighter. A tier steps down in three
       things at once — size, weight, and ink. --- */

.display {                    /* Voice I — conviction */
  font-family: var(--font-display);
  font-weight: 500;
  letter-spacing: var(--track-display);
  line-height: 0.98;
  color: var(--ink);
}
.display-grand {              /* the guide's display: clamp(44,6.4vw,76) */
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(44px, 6.4vw, 76px);
  line-height: 0.98;
  letter-spacing: -0.062em;
  color: var(--ink);
}
.display-hero {               /* the shipped hero: clamp(34,6vw,58) */
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(34px, 6vw, 58px);
  line-height: 0.94;
  letter-spacing: var(--track-display);
  color: var(--ink);
}
.statement {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(30px, 4.2vw, 52px);
  letter-spacing: -0.055em;
  line-height: 1.04;
}
.heading {                    /* guide clamp; shipped h1 = clamp(28,3.6vw,40) */
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(24px, 3vw, 34px);
  letter-spacing: -0.05em;
  line-height: 1.05;
}
/* the shipped heading ladder (console / lead-gen / creative) */
h1, .h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(28px, 3.6vw, 40px); line-height: 1; letter-spacing: var(--track-display); }
h2, .h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(19px, 2.2vw, 24px); line-height: 1.12; letter-spacing: -0.05em; }
h3, .h3 { font-family: var(--font-display); font-weight: 600; font-size: clamp(16px, 1.7vw, 18px); line-height: 1.2; letter-spacing: -0.04em; }
.statement-grand { font-family: var(--font-display); font-weight: 500; font-size: clamp(2.4rem, 8vw, 6.6rem); line-height: 0.96; letter-spacing: var(--track-display); }
.callout { font-family: var(--font-display); font-weight: 650; font-size: clamp(20px, 2.6vw, 26px); letter-spacing: -0.04em; }
.interlude-couplet { font-family: var(--font-display); font-weight: 500; font-size: clamp(1.7rem, 4.6vw, 3.4rem); letter-spacing: var(--track-display); }
.interlude-close { font-family: var(--font-display); font-weight: 500; font-size: clamp(2.4rem, 7.4vw, 5.8rem); line-height: 0.98; letter-spacing: var(--track-display); }
.card-title {
  font-family: var(--font-display);
  font-weight: 650;
  letter-spacing: -0.04em;
}

.lead {                       /* Voice II — clarity */
  font-family: var(--font-reading);
  font-weight: 500;
  font-size: 17px;
  line-height: 1.55;
  letter-spacing: -0.015em;
  max-width: 62ch;
  color: var(--ink-soft);
}
.body,
.reading {
  font-family: var(--font-reading);
  font-weight: 500;
  font-size: 15px;
  line-height: 1.6;
  letter-spacing: -0.01em;
  max-width: 66ch;
  color: var(--ink-faint);
}
.caption {
  font-family: var(--font-reading);
  font-weight: 500;
  font-size: 12.5px;
  line-height: 1.5;
}

/* Numerals — Manrope 700, tabular, never 900. */
.numeral,
.fig {
  font-family: var(--font-numeral);
  font-weight: 700;
  letter-spacing: var(--track-numeral);
  font-variant-numeric: tabular-nums;
}

/* Voice III — the machine layer (League Spartan, uppercase). */
.micro {
  font-family: var(--font-machine);
  font-weight: 500;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--dim);
}
.eyebrow {
  font-family: var(--font-machine);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--signal-text);
}

/* The wordmark & big outlined numerals — the ONLY 900s. */
.wordmark {
  font-family: var(--font-display);
  font-weight: 900;              /* RECONCILED: Satoshi Black (constitution) */
  letter-spacing: -0.045em;
  text-transform: none;          /* never uppercased, even in the machine layer */
}
.actnum,
.ghost-numeral {
  font-family: var(--font-display);
  font-weight: 900;
  font-style: italic;
  letter-spacing: var(--track-display);
}
.actnum { font-size: clamp(72px, 11vw, 150px); } /* guide's stroked act numeral */

/* Body reading at the shipped base (15.5px/1.62) */
.body-base { font-family: var(--font-reading); font-weight: 400; font-size: 15.5px; line-height: 1.62; }
/* ============================================================
   form. — WORLDS (surfaces)
   Ported from the presentation system and ATOMIZED: the lineage
   hardcoded the blues, so a world could only ever glow blue. Here
   every tint routes through var(--signal)/var(--rim) via color-mix,
   so `.dept-cm .theme-void` glows amber, `.dept-strategy` emerald,
   and so on — the department drives the world.

   LAW: every world declares its FULL ink set, not a delta. It looks
   repetitive on purpose — a void inset nested in a light section
   would otherwise inherit light ink onto a dark ground.

   A ground is NEVER a flat colour: it is layered light over a base.
   ============================================================ */

/* ---- DARK WORLDS ---------------------------------------- */

.theme-void {
  --ink: #f4f5f7;
  --ink-soft: rgba(244, 245, 247, 0.72);
  --ink-faint: rgba(244, 245, 247, 0.50);
  --ink-dim: rgba(244, 245, 247, 0.52);
  --ink-ghost: rgba(244, 245, 247, 0.18);
  --line: rgba(244, 245, 247, 0.07);
  --line-strong: rgba(244, 245, 247, 0.15);
  --field-bg: rgba(3, 4, 7, 0.62);
  --card-bg: rgba(5, 7, 11, 0.50);
  --base: var(--void); --base-raise: var(--panel); --base-deep: var(--void-under);
  --ground: var(--void);
  background:
    radial-gradient(75% 60% at 50% 52%, rgba(255,255,255,0.035), rgba(255,255,255,0) 72%),
    radial-gradient(90% 60% at 50% -12%, color-mix(in srgb, var(--signal) 16%, transparent), transparent 62%),
    radial-gradient(58% 50% at 92% 8%, color-mix(in srgb, var(--rim) 7%, transparent), transparent 70%),
    var(--void);
}

.theme-panel {
  --ink: #f4f5f7;
  --ink-soft: rgba(244, 245, 247, 0.78);
  --ink-faint: rgba(244, 245, 247, 0.55);
  --ink-dim: rgba(244, 245, 247, 0.50);
  --ink-ghost: rgba(244, 245, 247, 0.16);
  --line: rgba(244, 245, 247, 0.08);
  --line-strong: rgba(244, 245, 247, 0.17);
  --field-bg: rgba(3, 4, 7, 0.50);
  --card-bg: rgba(5, 7, 11, 0.50);
  --base: var(--panel); --base-raise: var(--panel-raise); --base-deep: var(--panel-deep);
  --ground: var(--panel);
  background:
    radial-gradient(80% 55% at 50% -8%, color-mix(in srgb, var(--rim) 10%, transparent), transparent 62%),
    linear-gradient(180deg, #171c27 0%, #12161f 100%);
}

/* The signal world — a full-frame statement in the department colour.
   Rare, LARGE TEXT ONLY. The accent inverts (ink runs white→ice)
   because the committed colour is now the ground. */
.theme-signal {
  --ink: #fafafa;
  --ink-soft: rgba(250, 250, 250, 0.84);
  --ink-faint: rgba(250, 250, 250, 0.76);
  --ink-dim: rgba(250, 250, 250, 0.76);
  --ink-ghost: rgba(250, 250, 250, 0.30);
  --line: rgba(250, 250, 250, 0.20);
  --line-strong: rgba(250, 250, 250, 0.34);
  --ground: var(--signal);
  background:
    radial-gradient(120% 90% at 80% 0%, rgba(255,255,255,0.16), rgba(255,255,255,0) 55%),
    linear-gradient(180deg, var(--deep) 0%, var(--signal) 32%, var(--signal) 68%, var(--deep) 100%);
}
.theme-signal .grad-ink { background-image: linear-gradient(102deg, #ffffff 4%, #dce9ff 52%, var(--ice) 96%); }

/* ---- LIGHT WORLDS --------------------------------------- */

.theme-paper, .theme-grey, .theme-ice {
  --ink: var(--ink-black);
  --ink-soft: rgba(11, 13, 18, 0.76);
  --ink-faint: rgba(11, 13, 18, 0.56);
  --ink-dim: rgba(11, 13, 18, 0.60);
  --ink-ghost: rgba(11, 13, 18, 0.16);
  --line: rgba(11, 13, 18, 0.10);
  --line-strong: rgba(11, 13, 18, 0.20);
  --field-bg: #ffffff; --card-bg: #ffffff;
  --base: var(--paper); --base-raise: #ffffff; --base-deep: var(--paper-deep);
}
.theme-paper {
  --ground: var(--paper);
  background:
    radial-gradient(56% 44% at 96% 2%, color-mix(in srgb, var(--signal) 6%, transparent), transparent 70%),
    linear-gradient(180deg, #fcfcfd 0%, #f5f6f8 100%);
}
.theme-grey {
  --ground: var(--paper-deep);
  background:
    radial-gradient(60% 45% at 6% 0%, rgba(255,255,255,0.75), rgba(255,255,255,0) 60%),
    linear-gradient(180deg, #eef0f4 0%, #e1e4ea 100%);
}
.theme-ice {
  --base: #f2f6fd; --base-deep: #e8effc; --ground: #eef3fb;
  background:
    radial-gradient(70% 55% at 90% 0%, color-mix(in srgb, var(--signal) 17%, transparent), transparent 60%),
    radial-gradient(50% 45% at 4% 100%, color-mix(in srgb, var(--ice) 22%, transparent), transparent 62%),
    linear-gradient(180deg, #f7faff 0%, #edf3fc 100%);
}

/* The cover wash — the ONLY surface that carries the blueprint grid. */
.cover-wash {
  --ink: var(--ink-black);
  --ink-soft: rgba(11, 13, 18, 0.76);
  --ink-dim: rgba(11, 13, 18, 0.60);
  --line: rgba(11, 13, 18, 0.10);
  --base: var(--paper); --ground: var(--paper);
  background:
    radial-gradient(64% 52% at 88% 4%, color-mix(in srgb, var(--signal) 11%, transparent), transparent 62%),
    radial-gradient(56% 48% at 6% 92%, color-mix(in srgb, var(--deep) 8%, transparent), transparent 60%),
    linear-gradient(to right, rgba(11,13,18,0.035) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(11,13,18,0.035) 1px, transparent 1px),
    linear-gradient(180deg, #fcfcfd 0%, #f5f6f8 100%);
  background-size: auto, auto, 96px 96px, 96px 96px, auto;
  background-position: center top;
}

/* On paper, glass stops being glass: a printed card catching real
   light — no blur, white ground, honest shadow. */
.theme-paper .glass, .theme-grey .glass, .theme-ice .glass, .cover-wash .glass {
  background: #ffffff;
  border-color: rgba(11, 13, 18, 0.08);
  box-shadow: inset 0 1px 0 0 #ffffff,
    0 2px 6px -2px rgba(11, 13, 18, 0.12),
    0 28px 60px -30px rgba(11, 13, 18, 0.28);
  backdrop-filter: none; -webkit-backdrop-filter: none;
}

/* Dark-world state-signal variants (brighter on dark grounds). */
.theme-void, .theme-panel, .theme-signal {
  --live: #4cc98a; --warn: #e8b34c; --stop: #ff7a70;
}
/* ============================================================
   form. — THE FINISH ("the seven g's")
   The grade over a correct flat layout. Remove these and the page
   is right but dead. All accent-driven bits route through the active
   department's signal family.

   grain · ground · glow · grand light · glass · grade · grid
   (ground + grid live in worlds.css; the rest are here.)
   ============================================================ */

/* elevation tokens — brand-elevation-brief v2 (2026-08-26): the named
   tokens the UI/UX brief speaks in, landed here rather than forked into a
   second vocabulary in a consuming app. Values are extracted from the
   glass/panel recipes already below, not invented fresh.

   --form-gold stays deliberately unset (see form-design-system's
   tokens/form.tokens.css — "pending canonical source reconciliation").
   Consumers fall back to silver-only atmosphere until it's locked; do not
   guess a hex here. */
:root {
  --glass-recipe: blur(22px) saturate(1.4);
  /* two-layer contact+ambient idiom already used by .btn--solid below,
     packaged as the reusable non-glass panel-elevation token. */
  --shadow-panel: 0 1px 2px rgba(5, 7, 11, 0.4), 0 12px 32px rgba(5, 7, 11, 0.16);
  --scroll-progress: 0;

  --prism-opacity-subtle:    0.12;
  --prism-opacity-standard:  0.22;
  --prism-opacity-signature: 0.34;
  --prism-blur-subtle:    8px;
  --prism-blur-standard:  14px;
  --prism-blur-signature: 22px;
}

/* grain — one monochrome film stock over everything (~5%), the thing
   that makes seven grounds read as one document on one stock. */
.grain {
  position: fixed; inset: 0; z-index: var(--z-grain);
  pointer-events: none; opacity: var(--grain-opacity); mix-blend-mode: overlay;
  transform: translateZ(0);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");
}

/* glass — RATIONED: one surface per document, the thing being decided.
   1px top highlight + gradient body + long soft shadow.
   (guide 05-series glass stack: inset .09 lip, contact .5, ambient .4) */
.glass {
  background: rgba(20, 24, 33, 0.46);
  border: 1px solid rgba(255, 255, 255, 0.09);
  box-shadow: inset 0 1px 0 0 rgba(244, 245, 247, 0.09),
    0 2px 4px rgba(3, 4, 6, 0.5), 0 24px 60px rgba(3, 4, 6, 0.4);
  backdrop-filter: var(--glass-recipe);
  -webkit-backdrop-filter: var(--glass-recipe);
  border-radius: var(--r);
}

/* the machined dark button — guide law 07·a, built by layer.
   body gradient · hairline border · inset top light · contact shadow ·
   ambient shadow. Flat is a defect; glare is a defect. */
.btn--machined {
  color: var(--soft);
  background: linear-gradient(180deg, #161a22 0%, #0a0d13 45%, #020305 100%);
  border: 1px solid rgba(255, 255, 255, 0.09);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.14),
    0 1px 2px rgba(5, 7, 11, 0.4),
    0 12px 32px rgba(5, 7, 11, 0.16);
  transition: transform 0.2s var(--ease-form), box-shadow 0.2s var(--ease-form);
}
.btn--machined:hover {
  transform: translateY(-2px);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.14),
    0 1px 2px rgba(5, 7, 11, 0.4),
    0 24px 60px rgba(5, 7, 11, 0.16);
}

/* the aurora — ONE drifts per page, 22s, blurred, near-invisible */
.aurora {
  position: absolute; pointer-events: none;
  width: min(52vw, 640px); height: min(52vw, 640px);
  background: radial-gradient(closest-side, color-mix(in srgb, var(--signal) 14%, transparent), transparent 70%);
  filter: blur(6px);
  animation: aurora-drift 22s var(--ease-form) infinite alternate;
}
@keyframes aurora-drift {
  from { transform: translate3d(0, 0, 0) scale(1.045); }
  to   { transform: translate3d(3%, -2%, 0) scale(1.07); }
}

/* photo washes — the wash laws (~20% desaturation toward the world) */
.photo-wash-dark  { filter: saturate(0.8); }
.photo-wash-dark::after  { content: ""; position: absolute; inset: 0; background: color-mix(in srgb, var(--void) 20%, transparent); pointer-events: none; }
.photo-wash-light { filter: saturate(0.8); }
.photo-wash-light::after { content: ""; position: absolute; inset: 0; background: color-mix(in srgb, var(--paper) 20%, transparent); pointer-events: none; }

/* lit inset — rim + signal glows with an ice top hairline (creative lineage) */
.lit-inset {
  position: relative;
  border-top: 1px solid color-mix(in srgb, var(--ice) 55%, transparent);
  background:
    radial-gradient(60% 45% at 12% 0%, color-mix(in srgb, var(--rim) 10%, transparent), transparent 60%),
    radial-gradient(50% 40% at 88% 100%, color-mix(in srgb, var(--signal) 8%, transparent), transparent 65%);
}

/* the scroll-progress hairline — 2px, signal→rim, top of viewport */
.progress-hairline {
  position: fixed; top: 0; left: 0; height: 2px; width: calc(var(--scroll-progress) * 100%);
  z-index: var(--z-banner);
  background: linear-gradient(90deg, var(--signal), var(--rim));
}

/* glow — the corner glow on dark-world act corners. overflow:hidden
   is load-bearing (without it the glow stains the neighbour). */
.corner-glow { position: relative; overflow: hidden; }
.corner-glow::before {
  content: ""; position: absolute; top: -6%; left: -12%;
  width: min(46vw, 560px); height: min(46vw, 560px); pointer-events: none;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--signal) 17%, transparent), transparent 72%);
}

/* --- THE THREE GRADIENTS (the only three that exist) --------- */
.grad-ink {                    /* headline accents only — never body, never wordmark */
  background-image: var(--grad-ink);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
}
.rail-fill  { background-image: var(--grad-rail); }   /* progress, meters */
.chip-edge  { background-image: var(--grad-chip); }   /* pantone-chip edges */

/* --- EMPHASIS SET (one per section, dispatched deliberately) ---
   Full creative-lineage vocabulary: under / wash / outline / ink /
   display / weight. */
.mark-under   { text-decoration: underline; text-decoration-color: var(--signal); text-decoration-thickness: 2px; text-underline-offset: 0.18em; }
.mark-wash    { background: var(--signal-wash); box-decoration-break: clone; -webkit-box-decoration-break: clone; padding-inline: 0.12em; }
.mark-outline { color: transparent; -webkit-text-stroke: 1.5px var(--ink); }
@supports not ((-webkit-text-stroke: 1px black)) { .mark-outline { color: var(--ink); } }
.mark-ink     { color: var(--signal-text); }           /* body-size accent */
.mark-display { color: var(--deep); }                  /* display-size accent (≥24px) */
.mark-weight  { font-weight: 650; }                    /* emphasis by weight, not color */

/* --- SEAM & VERDICT BAND ------------------------------------- */
.world-seam { position: relative; }
.world-seam::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 130px;
  pointer-events: none; z-index: var(--z-field);
  border-top: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(11,13,18,0.055), rgba(11,13,18,0));
}
.theme-void.world-seam::before, .theme-panel.world-seam::before, .theme-signal.world-seam::before {
  background: linear-gradient(180deg, rgba(0,0,0,0.42), rgba(0,0,0,0));
}
.verdict-band { position: relative; }
.verdict-band::before {
  content: ""; position: absolute; inset: 0 -50vw; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, transparent 0%,
    var(--verdict-tint, var(--signal-wash)) 30%,
    var(--verdict-tint, var(--signal-wash)) 70%, transparent 100%);
}

/* --- LIVE-STATE PULSE DOT (label + motion, never colour alone) --- */
.pulse-dot { position: relative; width: 7px; height: 7px; border-radius: var(--pill); background: var(--signal); }
.pulse-dot::after {
  content: ""; position: absolute; inset: -4px; border-radius: var(--pill);
  border: 1px solid var(--signal); opacity: 0.5;
  animation: pulse-ring 2.2s var(--ease-form) infinite;
}
@keyframes pulse-ring { to { transform: scale(1.4); opacity: 0; } }

/* The Skeleton component's loading pulse (components/Skeleton.tsx) —
   reserves layout, no shift, per the four-states law (13.4). */
@keyframes form-skeleton-pulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 0.9; }
}

/* Accent voices. */
.voice-signal { color: var(--signal); }
.voice-rim    { color: var(--rim); }
.voice-spark  { color: var(--spark); }

/* Motion settles, never performs — reduced-motion renders the settled state. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
}
/* ============================================================
   form. — THE GRAMMAR
   The component/print vocabulary of the system — the pieces the
   shipped surfaces (artifacts, lead-gen, creative-website, console)
   all speak. Everything routes through tokens; nothing here names a
   raw brand hex.

   Print grammar, not card grammar: rows are engraved, money is
   ledger print, sequences are rails. "Target half the cards you
   think you need."
   ============================================================ */

/* ---- THE LOCKUP (live text, never a picture) ---------------- */
.lockup {
  --lockup-size: 20px;
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  white-space: nowrap;
  font-size: var(--lockup-size);
}
.lockup__mark {
  font-family: var(--font-satoshi);
  font-weight: 900;
  font-size: 1em;
  letter-spacing: -0.045em;
  color: var(--ink);
  text-transform: none; /* the wordmark never uppercases, even in the machine layer */
}
.lockup__dot { color: var(--signal); } /* the period is the brand */
.lockup__rule {
  width: 1px; height: 0.72em;
  background: var(--ink-ghost);
  margin-inline: 0.42em 0.5em;
}
.lockup__dept {
  font-family: var(--font-manrope);
  font-weight: 500;
  font-size: 0.74em;
  letter-spacing: -0.035em;
  color: var(--ink-faint);
}
@media (max-width: 640px) {
  /* the mark alone carries the brand on a phone */
  .lockup__dept, .lockup__rule { display: none; }
}

/* ---- THE SLOGAN — the ONE Plex Mono surface ----------------- */
.slogan {
  font-family: var(--font-slogan);
  font-weight: 400;
  font-size: 0.6875rem;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* ---- BUTTONS — machined objects; flat is a defect ----------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 0.5em;
  font: 700 14px/1 var(--font-label);
  letter-spacing: 0.01em;
  min-height: 44px;
  padding: 0 1.15rem;
  border-radius: 13px;
  cursor: pointer;
  text-decoration: none;
  transition: transform var(--motion-base) var(--ease-form),
    box-shadow var(--motion-base) var(--ease-form);
}
.btn--solid {
  color: var(--white);
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--signal) 92%, #fff) 0%,
    var(--signal) 45%,
    var(--deep) 100%);
  border: 1px solid var(--deep);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.18),   /* the top light */
    0 1px 2px rgba(5, 7, 11, 0.4),             /* contact */
    0 12px 32px rgba(5, 7, 11, 0.16);          /* ambient */
}
.btn--solid:hover {
  transform: translateY(-2px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18),
    0 1px 2px rgba(5, 7, 11, 0.4), 0 24px 60px rgba(5, 7, 11, 0.2);
}
.btn--ghost {
  color: var(--signal-text);
  background: transparent;
  border: 1px solid var(--line-strong);
}
.btn--ghost:hover { background: var(--signal-wash); }

/* ---- ENGRAVED ROWS (the list grammar; not cards) ------------ */
.rows { border-top: 1px solid var(--line); }
.row {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--g1);
  padding-block: 0.85rem;
  border-bottom: 1px solid var(--line);
}
.row__term { font: 650 15px/1.3 var(--font-label); color: var(--ink); }
.row__def  { color: var(--ink-faint); }
@media (hover: hover) {
  .row-live {
    transition: background 0.35s var(--ease-form);
    margin-inline: -0.75rem; padding-inline: 0.75rem;
  }
  .row-live:hover { background: var(--signal-wash); }
}

/* ---- THE LEDGER (money as print, never a card) -------------- */
.ledger { border-top: 1px solid var(--line-strong); }
.ledger__row {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--g2);
  padding-block: 1rem;
  border-bottom: 1px solid var(--line);
}
.ledger__label { font: 650 17px/1.3 var(--font-satoshi); letter-spacing: -0.04em; color: var(--ink); }
.ledger__amount {
  font: 700 clamp(20px, 2.4vw, 26px)/1 var(--font-manrope);
  letter-spacing: var(--track-numeral);
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.ledger__amount .cur { opacity: 0.3; } /* currency symbol dimmed */
.ledger__total { border-bottom: none; border-top: 2px solid var(--ink); }

/* ---- THE SEQUENCE RAIL -------------------------------------- */
.seq { counter-reset: seq; }
.seq__item {
  display: grid; grid-template-columns: 2.6rem 1fr; gap: var(--g1);
  padding-block: var(--s-2);
  border-bottom: 1px solid var(--line);
}
.seq__n {
  font: 700 0.8125rem/1.6 var(--font-manrope);
  letter-spacing: var(--track-numeral);
  font-variant-numeric: tabular-nums;
  color: var(--signal-text);
}

/* ---- GHOST ARCHITECTURE ------------------------------------- */
.ghost-numeral {
  color: transparent;
  -webkit-text-stroke: 1.5px var(--ink-ghost);
  user-select: none;
  line-height: 0.8;
}
.theme-void .ghost-numeral { -webkit-text-stroke: 1.5px color-mix(in srgb, var(--rim) 50%, transparent); }
.ghost-arch {
  font: 900 clamp(8rem, 24vw, 20rem)/0.8 var(--font-satoshi);
  font-style: italic;
  letter-spacing: var(--track-display);
}

/* ---- STRUCTURE ---------------------------------------------- */
.shell {
  width: 100%; max-width: var(--shell);
  margin-inline: auto;
  padding-inline: var(--gutter);
}
.hairline { border-top: 1px solid var(--line); }
.full-bleed { margin-inline: calc(50% - 50vw); }
/* single-hairline two-column (creative's .walls/.split) */
.split { display: grid; grid-template-columns: 1fr 1fr; }
.split > * + * { border-left: 1px solid var(--line); padding-left: var(--s-3); }
.split > *:first-child { padding-right: var(--s-3); }

/* Symmetry: the act label with twin gradient hairline wings. */
.actlabel {
  display: flex; align-items: center; gap: var(--g2);
  font: 600 11px/1 var(--font-label);
  letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--signal-text);
}
.actlabel::before, .actlabel::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, var(--line-strong));
}
.actlabel::after { background: linear-gradient(90deg, var(--line-strong), transparent); }

/* ---- THE MARQUEE (ribbon ends always frost into the surface) - */
.marquee {
  overflow: hidden; white-space: nowrap;
  mask-image: linear-gradient(90deg, transparent 0%, #000 9%, #000 91%, transparent 100%);
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 9%, #000 91%, transparent 100%);
}
.marquee__track {
  display: inline-flex; gap: var(--s-4);
  animation: marquee 42s linear infinite;
}
.marquee:hover .marquee__track { animation-play-state: paused; }
@keyframes marquee { to { transform: translateX(-50%); } }

/* ---- THE SCRIM (photography law: type never sits on a raw photo) */
.scrim { position: relative; }
.scrim::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, transparent 45%, rgba(5, 7, 11, 0.9) 100%);
}

/* ---- THE STUDIO SWEEPS (grounds for statements, near-tonal) --- */
.sweep-dark {
  background: conic-gradient(from 210deg at 62% 30%,
    #030406, #0a0f1a 22%, #05070b 48%, #0b101c 74%, #030406);
}
.sweep-light {
  background: conic-gradient(from 170deg at 55% 20%,
    #fafbfc, #f0f2f7 24%, #f6f7f9 50%, #eef1f6 76%, #fafbfc);
}

/* ---- REVEAL (28px rise, once, on first sight; stagger 90ms) --- */
@keyframes rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
.reveal { animation: rise 0.9s var(--ease-veil) both; }
.reveal > * + * { animation: rise 0.9s var(--ease-veil) both; animation-delay: 90ms; }

/* ---- THE PROGRESS HAIRLINE ---------------------------------- */
.progress-rail {
  height: 2px;
  background: var(--grad-rail);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--void);color:var(--ink);overflow-x:clip}
/* the worlds rebind the ink token; the section must re-apply it, or headings inherit the page's black */
.theme-void,.theme-panel,.theme-signal{color:var(--ink)}
/* on dark grounds the small accents read in the rim, never the deep text-blue */
.theme-void .eyebrow,.theme-panel .eyebrow,.theme-void .actlabel,.theme-panel .actlabel,.theme-void .seq__n,.theme-panel .seq__n,
.theme-void .beats td.scr,.theme-panel .beats td.scr,.theme-void .copyblock pre em,.theme-panel .copyblock pre em,
.theme-void .chip,.theme-panel .chip{color:var(--rim)}
.theme-void .chip,.theme-panel .chip{border-color:color-mix(in srgb,var(--rim) 45%,transparent)}
.theme-void .chip--ink,.theme-panel .chip--ink{color:var(--ink-faint);border-color:var(--line-strong)}
.theme-void .chip--solid,.theme-panel .chip--solid{color:var(--white)}
.theme-void .actlabel::before,.theme-void .actlabel::after,.theme-panel .actlabel::before,.theme-panel .actlabel::after{background:linear-gradient(90deg,transparent,var(--line-strong))}
.theme-void .actlabel::after,.theme-panel .actlabel::after{background:linear-gradient(90deg,var(--line-strong),transparent)}
.act{position:relative;padding-block:var(--s-6)}
.act--cover{padding-block:var(--s-6) var(--s-5)}
.shell{max-width:1040px}
.cover-wash{overflow:hidden}
.cover-wash .aurora{top:-10%;right:-8%;left:auto}
.stack>*+*{margin-top:var(--s-3)}
.meta{display:flex;flex-wrap:wrap;gap:var(--g1);align-items:center}
.chip{display:inline-flex;align-items:center;gap:.5em;font:600 11px/1 var(--font-label);letter-spacing:.18em;text-transform:uppercase;color:var(--signal-text);border:1px solid var(--signal-line);border-radius:var(--pill);padding:.6em .9em;white-space:nowrap}
.chip--ink{color:var(--ink-faint);border-color:var(--line-strong)}
.chip--live{color:var(--live);border-color:color-mix(in srgb,var(--live) 40%,transparent)}
.chip--solid{color:var(--white);background:var(--signal);border-color:var(--deep)}
.review-note{padding:var(--s-3);border-radius:var(--r-glass)}
.review-note .h3{margin:0 0 .35em}
